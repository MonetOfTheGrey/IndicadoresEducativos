<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Sistema de Indicadores Educativos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/Nunito.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/fontawesome-all.min.css' %}">
    
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body id="page-top">
    <div id="wrapper">

        <!-- 🔹 Sidebar (bloque reemplazable)
        {% block sidebar %}
        <nav class="navbar align-items-start p-0 sidebar sidebar-dark accordion bg-gradient-primary navbar-dark" style="background: var(--bs-secondary);">
            <div class="container-fluid d-flex flex-column p-0">
                <a class="navbar-brand d-flex justify-content-center align-items-center m-0 sidebar-brand" href="#">
                    <div class="mx-3 sidebar-brand-text"><span>SEDUZAC</span></div>
                </a>
                <hr class="my-0 sidebar-divider">
                <ul class="navbar-nav text-light" id="accordionSidebar">
                     Sidebar vacío por defecto 
                </ul>
            </div>
        </nav>
        {% endblock %} -->

        <!-- Contenido principal -->
        <div class="d-flex flex-column" id="content-wrapper">
            <div id="content">

                <!-- 🔹 Navbar superior -->
                <nav class="navbar navbar-expand bg-white shadow d-xl-flex mb-4 topbar">
                    <div class="container-fluid">
                        <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                            <span class="fw-bold">Sistema de Indicadores Educativos del Estado de Zacatecas</span>

                            <!-- Botones globales -->
                            <a class="btn btn-outline-primary btn-sm" href="{% url 'blank' %}">
                                <i class="fas fa-tachometer-alt"></i> Inicio
                            </a>
                            <a class="btn btn-outline-secondary btn-sm" href="{% url 'iniciar_sesion' %}">
                                <i class="far fa-user-circle"></i> Iniciar Sesión
                            </a>
                            <a class="btn btn-outline-success btn-sm" href="{% url 'panel_datos' %}">
                                <i class="fas fa-table"></i> Panel de Datos
                            </a>
                        </a>
                    </div>
                </nav>

                <!-- 🔹 Contenido funcional de cada página -->
                {% block funcionalidad %}{% endblock %}
            </div>

            <!-- Footer -->
            <footer class="bg-white sticky-footer">
                <div class="container my-auto">
                    <div class="text-center my-auto copyright">
                        <span>Copyright © SEDUZAC 2025</span>
                    </div>
                </div>
            </footer>
        </div>

        <!-- Scroll-to-top -->
        <a class="border rounded d-inline scroll-to-top" href="#page-top">
            <i class="fas fa-angle-up"></i>
        </a>
    </div>

    <!-- Scripts -->
    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/bs-init.js' %}"></script>
    <script src="{% static 'js/theme.js' %}"></script>

    <script>
        $(document).ready(function () {
            $('#dataTable').DataTable({
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                ordering: true
            });
        });
    </script>
</body>
</html>
